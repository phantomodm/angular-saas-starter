<div class="p-4 md:p-8 space-y-6">
  <h1 class="text-2xl font-semibold">API Key Usage</h1>

  <mat-card class="p-4 space-y-4" *ngIf="usage()">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <mat-card class="p-4">
        <h3 class="text-sm text-neutral-500">Total Requests</h3>
        <p class="text-3xl font-semibold">{{ usage()?.total_requests }}</p>
      </mat-card>

      <mat-card class="p-4">
        <h3 class="text-sm text-neutral-500">Last 24 Hours</h3>
        <p class="text-3xl font-semibold">{{ usage()?.last_24h }}</p>
      </mat-card>

      <mat-card class="p-4">
        <h3 class="text-sm text-neutral-500">Last Used</h3>
        <p class="text-xl font-semibold">
          {{ usage()?.last_used_at | date: "medium" }}
        </p>
      </mat-card>
    </div>

    <h2 class="text-lg font-semibold mt-6">Endpoint Breakdown</h2>

    <div class="overflow-x-auto">
      <table
        mat-table
        [dataSource]="(usage()?.endpoints | keyvalue) ?? []"
        class="min-w-full"
      >
        <ng-container matColumnDef="endpoint">
          <th mat-header-cell *matHeaderCellDef>Endpoint</th>
          <td mat-cell *matCellDef="let row">{{ row.key }}</td>
        </ng-container>

        <ng-container matColumnDef="count">
          <th mat-header-cell *matHeaderCellDef>Requests</th>
          <td mat-cell *matCellDef="let row">{{ row.value }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
  </mat-card>
</div>
