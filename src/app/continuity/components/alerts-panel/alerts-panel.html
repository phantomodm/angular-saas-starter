<mat-card class="alerts-card">
  <h3 class="section-title">Alerts</h3>

  <!-- No alerts -->
  @if (sorted().length === 0) {
    <div class="empty">
      <mat-icon>notifications_none</mat-icon>
      <span>No alerts for {{ symbol || 'this symbol' }}.</span>
    </div>
  }

  <!-- Alerts list -->
  @for(a of sorted(); track a.id) {
    @for (a of sorted(); track a) {
      <div class="alert-item">
        <div class="alert-header">
          <mat-icon [style.color]="colorFor(a.severity)">warning</mat-icon>
          <span class="alert-title">{{ a.title }}</span>
        </div>
        <div class="alert-body">
          <p>{{ a.description }}</p>
          <small>{{ a.timestamp | date:'short' }}</small>
        </div>
      </div>
    }
  }

</mat-card>
