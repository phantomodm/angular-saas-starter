<mat-card class="forecast-card">
  <h3 class="section-title">Forecast</h3>

  @if (loading()) {
    <div>Loading forecast…</div>
  }
  @if (!loading()) {
    <table mat-table [dataSource]="rows()">
      <!-- Date -->
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let r">
          {{ r.date | date: "yyyy-MM-dd HH:mm" }}
        </td>
      </ng-container>
      <!-- Continuity -->
      <ng-container matColumnDef="c">
        <th mat-header-cell *matHeaderCellDef>C</th>
        <td mat-cell *matCellDef="let r">
          {{ r.continuity | number: "1.3-3" }}
        </td>
      </ng-container>
      <!-- Trend -->
      <ng-container matColumnDef="t">
        <th mat-header-cell *matHeaderCellDef>T</th>
        <td mat-cell *matCellDef="let r">
          {{ r.trend | number: "1.3-3" }}
        </td>
      </ng-container>
      <!-- Acceleration -->
      <ng-container matColumnDef="a">
        <th mat-header-cell *matHeaderCellDef>A</th>
        <td mat-cell *matCellDef="let r">
          {{ r.acceleration | number: "1.3-3" }}
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  }
</mat-card>
