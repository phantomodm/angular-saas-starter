<div class="predictive-container relative w-full h-32 px-4 py-8 bg-[#0a0a0c]/50 backdrop-blur-sm border-t border-white/5">
  
  <div class="flex justify-between text-[10px] uppercase tracking-[0.2em] text-slate-600 mb-4">
    <span>Ecosystem Horizon</span>
    <span>30-Day Window</span>
  </div>

  <div class="relative w-full h-[2px] bg-white/10 rounded-full">
    
    <div class="absolute top-1/2 -translate-y-1/2 h-8 bg-blue-500/5 blur-xl transition-all duration-1000"
         [style.left.%]="snapPosition() - 15"
         [style.width.%]="30">
    </div>

    <div class="absolute top-1/2 -translate-y-1/2 h-4 bg-blue-500/20 blur-md transition-all duration-700"
         [style.left.%]="band80().left"
         [style.width.%]="band80().width">
    </div>

    <div class="absolute top-1/2 -translate-y-1/2 h-3 w-3 rounded-full bg-blue-500 shadow-[0_0_15px_#3b82f6] z-10 transition-all duration-500"
         [style.left.%]="snapPosition()">
      
      <div class="absolute -top-10 left-1/2 -translate-x-1/2 whitespace-nowrap">
        <span class="block text-[10px] text-blue-400 font-bold tracking-widest uppercase">
          {{ state()?.leadTimeDays }} Day Signal
        </span>
        <span class="text-[8px] text-slate-500 uppercase">SNAP Point</span>
      </div>
    </div>
  </div>

  <div class="mt-8 text-center">
    <p class="text-[9px] text-slate-600 uppercase tracking-widest">
      Forecast precision varies by ecosystem and regime. 
      <i class="lucide-info inline-block w-2 h-2 ml-1 cursor-help"></i>
    </p>
  </div>
</div>
