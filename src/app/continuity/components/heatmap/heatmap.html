<mat-card class="heatmap-card">
  <h3 class="section-title">Continuity Heatmap</h3>

  <div class="heatmap-grid">
    @for (p of data(); track p.node) {
      <div
        class="heatmap-cell"
        [style.backgroundColor]="colorFor(p.value)"
        matTooltip="{{ p.node }} • {{ p.value | number: '1.3-3' }}"
      >
        <span class="label">{{ p.node }}</span>
      </div>
    }
  </div>
</mat-card>
