<mat-card class="p-4">
  <h2 class="text-lg font-semibold mb-4">Microstructure Charts</h2>

  <apx-chart
    [series]="priceSeries()"
    [chart]="{ type: 'line', height: 250 }"
    [xaxis]="{ type: 'datetime' }"
    (chartInit)="onPriceChartInit($event)"
  ></apx-chart>

  <apx-chart
    [series]="continuitySeries()"
    [chart]="{ type: 'line', height: 250 }"
    [xaxis]="{ type: 'datetime' }"
    (chartInit)="onContinuityChartInit($event)"
  ></apx-chart>

  <apx-chart
    [series]="scheerSeries()"
    [chart]="{ type: 'heatmap', height: 250 }"
  ></apx-chart>

  <button
    (click)="startReplay()"
    class="px-3 py-1 bg-blue-700 rounded text-white"
  >
    Replay Collapse
  </button>
</mat-card>
