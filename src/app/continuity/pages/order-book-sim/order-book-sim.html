<div class="col-span-12">
  <app-collapse-banner></app-collapse-banner>
</div>
<div class="p-4 grid grid-cols-12 gap-4">
  <!-- Mode Toggle + Regime Indicator -->
  <div class="col-span-12 flex items-center space-x-4 mb-4">
    <mat-button-toggle-group
      [value]="mode()"
      (change)="setMode($event.value)"
      appearance="legacy"
    >
      <mat-button-toggle value="simulator">Simulator</mat-button-toggle>
      <mat-button-toggle value="replay">Replay</mat-button-toggle>
      <mat-button-toggle value="live">Live</mat-button-toggle>
    </mat-button-toggle-group>

    <app-regime-indicator></app-regime-indicator>
  </div>

  <div class="flex flex-col lg:flex-row col-span-12 gap-4 lg:items-center">
    <!-- Symbol Selector + Momentum Overview (same row) -->
    <div class="col-span-12 lg:col-span-4">
      <app-symbol-selector></app-symbol-selector>
    </div>
    <div class="col-span-12 lg:col-span-4">
      <app-momentum-overview></app-momentum-overview>
    </div>
    <div class="col-span-12 lg:col-span-4">
      <app-collapse-gauge></app-collapse-gauge>
    </div>
  </div>

  <!-- Order Book Depth (6 columns) -->
  <div class="col-span-12 lg:col-span-6">
    <app-orderbook-depth2></app-orderbook-depth2>
  </div>

  <!-- Scheer Heatmap (6 columns) -->
  <div class="col-span-12 lg:col-span-6">
    <app-scheer-depth-heatmap></app-scheer-depth-heatmap>
  </div>

  <!-- Microstructure Charts -->
  <div class="col-span-12">
    <app-microstructure-charts></app-microstructure-charts>
  </div>

  <!-- Trade Tape (moved up) -->
  <div class="col-span-12 lg:col-span-6">
    <app-trade-tape></app-trade-tape>
    <app-bot-panel></app-bot-panel>
  </div>
  
  <!-- Collapse Alerts Feed -->
  <div class="col-span-12 lg:col-span-4">
    <app-collapse-alerts></app-collapse-alerts>
  </div>

  <!-- Collapse Gauge (moved up + centered) -->
  <div class="col-span-12 lg:col-span-6">
    <app-collapse-gauge></app-collapse-gauge>
  </div>

  <!-- Three-column gauge/heatmap layout -->
  <div class="col-span-12 lg:col-span-4">
    <app-volatility-heatmap></app-volatility-heatmap>
  </div>

  <div class="col-span-12 lg:col-span-4">
    <app-scheer-heatmap></app-scheer-heatmap>
    <app-scheer-depth-heatmap></app-scheer-depth-heatmap>
  </div>

  <div class="col-span-12 lg:col-span-4">
    <app-collapse-gauge></app-collapse-gauge>
  </div>
</div>
