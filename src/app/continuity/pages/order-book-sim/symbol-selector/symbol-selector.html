<mat-card class="p-4">
  <mat-form-field appearance="outline" class="w-full">
    <mat-label>Select Symbol</mat-label>
    <mat-select
      [value]="selectedSymbol()"
      (selectionChange)="onSelect($event.value)"
    >
      @for( s of symbols; track s){
        <mat-option [value]="s">
        {{ s }}
      </mat-option>
      }
      
    </mat-select>
  </mat-form-field>
</mat-card>
