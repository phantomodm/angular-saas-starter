<mat-card class="p-4">
  <mat-form-field appearance="outline" class="w-full">
    <mat-label>Select Symbol</mat-label>
    <mat-select
      [value]="selectedSymbol()"
      (selectionChange)="onSelect($event.value)"
    >
      <mat-option *ngFor="let s of symbols" [value]="s">
        {{ s }}
      </mat-option>
    </mat-select>
  </mat-form-field>
</mat-card>
