<div class="nodes-container">

  <!-- HEADER -->
  <mat-card class="nodes-header">
    <h1 class="nodes-title">Node Explorer</h1>
    <p class="nodes-subtitle">Analyze node-level contributions to continuity</p>
  </mat-card>

  <!-- SEARCH BAR -->
  <mat-card class="nodes-search">
    <mat-form-field  class="nodes-search-field">
      <mat-label>Search nodes</mat-label>
      <input title="Search" matInput (keyup)="applyFilter($event.target.value)" />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </mat-card>

  <!-- TABLE + CHART GRID -->
  <div class="nodes-grid">

    <!-- NODE TABLE -->
    <mat-card class="nodes-table-card">
      <h3 class="section-title">Node Metrics</h3>

      <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z1">

        <!-- NODE -->
        <ng-container matColumnDef="node">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Node</th>
          <td mat-cell *matCellDef="let n">{{ n.node }}</td>
        </ng-container>

        <!-- VALUE -->
        <ng-container matColumnDef="value">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Continuity</th>
          <td mat-cell *matCellDef="let n"
              [ngClass]="{ neg: isNegative(n.value), pos: isPositive(n.value) }">
            {{ n.value }}
          </td>
        </ng-container>

        <!-- TIMESTAMP -->
        <ng-container matColumnDef="timestamp">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Updated</th>
          <td mat-cell *matCellDef="let n">
            {{ n.timestamp | date:'short' }}
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>

      <!-- PAGINATION -->
      <mat-paginator
        [pageSize]="10"
        [pageSizeOptions]="[5, 10, 20, 50]"
        showFirstLastButtons>
      </mat-paginator>
    </mat-card>

    <!-- ATTRIBUTION CHART -->
    <mat-card class="nodes-chart-card">
      <h3 class="section-title">Node Attribution</h3>

      <div class="chart-container">
        <canvas
          baseChart
          [data]="attributionData"
          [options]="attributionOptions"
          chartType="bar">
        </canvas>
      </div>
    </mat-card>

  </div>
</div>
